version: '3.7'

services:
  rabbitmq:
    restart: always
    container_name: rabbitmq
    build: ./
    hostname: my-rabbit
    ports:
      - ${RABBITMQ_PORT}:5672      
      - ${RABBITMQ_WEB_PORT}:15672      
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PWD=${RABBITMQ_PWD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data:
    driver: local



